<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toko Produk Digital - Multi Varian</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    #cart-drawer, #detail-modal-card { transition: all 0.25s ease-in-out; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col font-sans antialiased">

  <!-- Toast Notification -->
  <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none w-full max-w-xs px-4"></div>

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 sm:px-8 py-3.5 flex justify-between items-center shadow-xs">
    <div class="flex items-center gap-3">
      <div class="bg-blue-600 text-white p-2 rounded-xl shadow-xs"><i data-lucide="zap" class="w-5 h-5"></i></div>
      <div>
        <h1 class="text-base sm:text-xl font-black tracking-tight text-blue-600 leading-tight">DIGITAL<span class="text-slate-800">STORE</span></h1>
        <p class="text-[10px] sm:text-xs text-slate-500 font-medium">Akun Premium & Lisensi Garansi Resmi</p>
      </div>
    </div>
    <div class="flex items-center gap-2 sm:gap-3">
      <a href="https://wa.me/6281234567890?text=Halo%20Admin,%20mau%20tanya%20produk%20digital" target="_blank" class="hidden sm:flex items-center gap-1.5 text-xs font-semibold text-emerald-600 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 px-3.5 py-2 rounded-xl transition-colors">
        <i data-lucide="message-circle" class="w-4 h-4"></i><span>Chat Admin</span>
      </a>
      <button onclick="toggleCart(true)" class="relative flex items-center justify-center bg-blue-50 text-blue-600 hover:bg-blue-100 p-2.5 rounded-xl transition-colors">
        <i data-lucide="shopping-cart" class="w-5 h-5"></i>
        <span id="cart-badge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold h-5 w-5 rounded-full flex items-center justify-center animate-pulse">0</span>
      </button>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="flex-1 w-full max-w-[98%] 2xl:max-w-[1800px] mx-auto px-2 sm:px-6 py-4 sm:py-6">
    <div class="w-full mb-4 sm:mb-6">
      <div class="relative w-full mb-3">
        <i data-lucide="search" class="absolute left-4 top-3.5 sm:top-4 w-4 h-4 sm:w-5 sm:h-5 text-slate-400"></i>
        <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Cari produk (contoh: Gemini, CapCut, Spotify)..." class="w-full pl-11 sm:pl-12 pr-4 py-2.5 sm:py-3.5 bg-white border border-slate-200 rounded-2xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-xs" />
      </div>
      <div id="category-tabs" class="flex gap-2 overflow-x-auto no-scrollbar py-1 text-xs"></div>
    </div>

    <div class="mb-3 sm:mb-4 px-1 flex items-center justify-between">
      <div>
        <h2 class="text-sm sm:text-lg font-bold text-slate-800 flex items-center gap-1.5">
          <i data-lucide="layout-grid" class="w-4 h-4 text-blue-600"></i> Katalog Produk (<span id="product-count">0</span>)
        </h2>
      </div>
      <span class="text-[11px] sm:text-xs text-emerald-600 font-semibold flex items-center gap-1">
        <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Garansi Full 100%
      </span>
    </div>

    <!-- Status Loading Data -->
    <div id="loading-indicator" class="flex flex-col items-center justify-center py-12 text-blue-600">
      <i data-lucide="loader-2" class="w-8 h-8 animate-spin mb-2"></i>
      <span class="text-xs font-semibold text-slate-500">Memuat Katalog Produk...</span>
    </div>

    <div id="product-grid" class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2 sm:gap-4 hidden"></div>
  </main>

  <a href="https://wa.me/6281234567890?text=Halo%20Admin,%20mau%20tanya%20seputar%20produk%20digital" target="_blank" class="fixed bottom-5 right-5 z-40 bg-emerald-500 hover:bg-emerald-600 text-white p-3.5 rounded-full shadow-lg flex items-center justify-center transition-all hover:scale-105 active:scale-95"><i data-lucide="message-circle" class="w-6 h-6"></i></a>

  <footer class="mt-auto py-6 border-t border-slate-200 text-center text-xs text-slate-500 bg-white">
    <p>© 2026 Toko Digital. All rights reserved.</p>
    <a href="admin.html" class="inline-block mt-1 text-[11px] text-slate-400 hover:text-blue-600 transition-colors">• Dashboard Admin</a>
  </footer>

  <!-- Modal Detail -->
  <div id="detail-modal" class="fixed inset-0 z-50 overflow-hidden hidden">
    <div onclick="closeDetailModal()" class="absolute inset-0 bg-black/50 backdrop-blur-xs"></div>
    <div class="fixed inset-0 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div id="detail-modal-card" class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
        <div class="relative p-4 border-b border-slate-100 flex items-center gap-3">
          <img id="modal-img" src="" alt="" class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl object-cover bg-slate-100 flex-shrink-0" />
          <div class="min-w-0 flex-1">
            <span id="modal-category" class="text-[10px] uppercase font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md"></span>
            <h3 id="modal-name" class="text-sm sm:text-base font-bold text-slate-900 truncate mt-1"></h3>
            <p id="modal-price" class="text-sm sm:text-base font-black text-blue-600 mt-0.5"></p>
          </div>
          <button onclick="closeDetailModal()" class="absolute top-4 right-4 p-1 rounded-full text-slate-400 hover:text-slate-600 hover:bg-slate-100"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="p-4 overflow-y-auto space-y-3.5 text-xs sm:text-sm flex-1">
          <div>
            <h4 class="font-bold text-slate-800 mb-2 text-xs flex items-center justify-between">
              <span>Pilih Paket / Durasi:</span><span id="modal-variant-stock" class="text-slate-500 font-normal"></span>
            </h4>
            <div id="modal-variants-list" class="flex flex-wrap gap-2"></div>
          </div>
          <div class="flex items-center gap-3 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
            <div class="text-center flex-1"><span class="text-[10px] text-slate-400 block">Total Terjual</span><span id="modal-sold" class="font-bold text-slate-800"></span></div>
            <div class="w-px h-6 bg-slate-200"></div>
            <div class="text-center flex-1"><span class="text-[10px] text-slate-400 block">Rating</span><span id="modal-rating" class="font-bold text-slate-800 flex items-center justify-center gap-1"></span></div>
          </div>
          <div><h4 class="font-bold text-slate-800 mb-1">Garansi</h4><p id="modal-warranty" class="text-slate-600 bg-blue-50/50 p-2.5 rounded-xl border border-blue-100 text-blue-800 font-medium"></p></div>
          <div><h4 class="font-bold text-slate-800 mb-1">Deskripsi Produk</h4><p id="modal-desc" class="text-slate-600 leading-relaxed whitespace-pre-line"></p></div>
        </div>
        <div class="p-3 sm:p-4 bg-slate-50 border-t border-slate-100 grid grid-cols-5 gap-2">
          <button id="modal-btn-chat" class="col-span-1 border border-emerald-300 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-xl flex flex-col items-center justify-center p-2 transition-colors"><i data-lucide="message-circle" class="w-4 h-4"></i><span class="text-[9px] font-bold mt-0.5">Chat</span></button>
          <button id="modal-btn-cart" class="col-span-2 bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 font-bold rounded-xl text-xs py-2.5 transition-colors">+ Keranjang</button>
          <button id="modal-btn-buy" class="col-span-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs py-2.5 transition-colors shadow-sm">Beli Sekarang</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Cart Drawer -->
  <div id="cart-modal" class="fixed inset-0 z-50 overflow-hidden hidden">
    <div onclick="toggleCart(false)" class="absolute inset-0 bg-black/40 backdrop-blur-xs"></div>
    <div class="fixed inset-y-0 right-0 max-w-full flex pl-10">
      <div id="cart-drawer" class="w-screen max-w-sm sm:max-w-md bg-white shadow-xl flex flex-col translate-x-full">
        <div class="px-4 py-4 border-b border-slate-100 flex items-center justify-between">
          <h3 class="text-sm sm:text-base font-bold text-slate-800 flex items-center gap-2"><i data-lucide="shopping-cart" class="w-4 h-4 text-blue-600"></i> Keranjang (<span id="cart-title-count">0</span>)</h3>
          <button onclick="toggleCart(false)" class="p-1.5 rounded-full text-slate-400 hover:text-slate-600 hover:bg-slate-100"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-3 sm:p-4 space-y-2.5"></div>
        <div id="cart-footer" class="p-4 border-t border-slate-100 bg-slate-50 space-y-3 hidden">
          <div class="flex justify-between items-center"><span class="text-xs text-slate-500 font-medium">Total Tagihan:</span><span id="cart-total-price" class="text-sm sm:text-base font-extrabold text-blue-600">Rp 0</span></div>
          <button onclick="processWhatsAppCheckout()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white py-3 rounded-xl font-bold text-xs sm:text-sm transition-all shadow-md flex items-center justify-center gap-2"><i data-lucide="message-circle" class="w-4 h-4"></i> Checkout via WhatsApp</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // URL API CLOUDFLARE WORKER ANDA
    const API_URL = "https://toko-digital-api.rizqinastore97.workers.dev";
    
    let products = [];
    let cart = [];
    let activeCategory = 'Semua';
    let searchQuery = '';
    let currentSelectedProduct = null;
    let currentSelectedVariant = null;

    const formatIDR = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bg = type === 'error' ? 'bg-red-600' : 'bg-slate-900';
      toast.className = `${bg} text-white text-xs font-semibold px-4 py-3 rounded-2xl shadow-xl flex items-center justify-between pointer-events-auto transform transition-all duration-300 opacity-0 translate-y-2`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('opacity-0', 'translate-y-2'), 10);
      setTimeout(() => { toast.classList.add('opacity-0', '-translate-y-2'); setTimeout(() => toast.remove(), 300); }, 2500);
    }

    // Mengambil Data dari Cloudflare
    async function loadProducts() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        if (data && Array.isArray(data) && data.length > 0) {
          products = data;
        } else {
          // Jika DB Kosong
          products = [];
        }
      } catch (error) {
        console.error("Gagal memuat produk dari Cloudflare:", error);
        showToast('Koneksi database bermasalah. Memuat data lokal...', 'error');
        products = JSON.parse(localStorage.getItem('admin_products')) || [];
      }

      // Sembunyikan loading, tampilkan grid
      document.getElementById('loading-indicator').classList.add('hidden');
      document.getElementById('product-grid').classList.remove('hidden');

      renderCategories();
      renderProducts();
    }

    function renderCategories() {
      const categories = ['Semua', ...new Set(products.map(p => p.category))];
      const tabs = document.getElementById('category-tabs');
      tabs.innerHTML = categories.map(cat => `<button onclick="setCategory('${cat}')" class="px-3.5 py-1.5 rounded-xl font-semibold transition-all whitespace-nowrap ${activeCategory === cat ? 'bg-blue-600 text-white shadow-xs' : 'bg-white text-slate-600 hover:bg-slate-200 border border-slate-200'}">${cat}</button>`).join('');
    }

    function setCategory(cat) { activeCategory = cat; renderCategories(); renderProducts(); }
    function handleSearch(query) { searchQuery = query.toLowerCase(); renderProducts(); }

    function renderProducts() {
      const grid = document.getElementById('product-grid');
      const filtered = products.filter(item => {
        const matchesCategory = activeCategory === 'Semua' || item.category === activeCategory;
        const matchesSearch = item.name.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSearch;
      });

      document.getElementById('product-count').innerText = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400"><i data-lucide="package-x" class="w-12 h-12 mx-auto stroke-1 mb-2"></i><p class="text-sm font-medium">Belum Ada Produk Tersedia</p></div>`;
        lucide.createIcons();
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const totalStock = item.variants.reduce((sum, v) => sum + Number(v.stock || 0), 0);
        const prices = item.variants.map(v => Number(v.price || 0));
        const minPrice = Math.min(...prices);
        const priceLabel = `Mulai ${formatIDR(minPrice)}`;
        const isOutOfStock = totalStock <= 0;

        return `
          <div class="bg-white border border-slate-200 rounded-2xl p-2 sm:p-4 flex flex-col justify-between hover:shadow-md hover:border-blue-300 transition-all group">
            <div class="flex flex-col items-center text-center cursor-pointer" onclick="openDetailModal(${item.id})">
              <div class="w-14 h-14 sm:w-20 sm:h-20 lg:w-24 lg:h-24 mb-2 rounded-2xl overflow-hidden bg-slate-50 flex items-center justify-center p-1 border border-slate-100 group-hover:scale-105 transition-transform">
                <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover rounded-xl" loading="lazy" />
              </div>
              <span class="text-[9px] sm:text-[11px] uppercase tracking-wider text-blue-600 font-bold mb-0.5">${item.category}</span>
              <h3 class="text-[11px] sm:text-sm font-semibold text-slate-800 line-clamp-2 leading-tight min-h-[2rem] sm:min-h-[2.5rem]">${item.name}</h3>
            </div>
            <div class="mt-2 text-center">
              <p class="text-[11px] sm:text-xs font-extrabold text-blue-600 mb-0.5 truncate">${priceLabel}</p>
              <div class="flex flex-wrap items-center justify-center gap-1 text-[9px] sm:text-xs mb-1.5 sm:mb-2 text-slate-500">
                <span class="text-yellow-400 font-bold text-xs sm:text-sm leading-none">★</span>
                <span class="font-bold text-slate-700">${item.rating || '5.0'}</span>
                <span>•</span><span>${item.sold || 0} Terjual</span>
              </div>
              <button onclick="openDetailModal(${item.id})" class="w-full ${isOutOfStock ? 'bg-slate-100 text-slate-400' : 'bg-blue-600 hover:bg-blue-700 text-white'} text-[11px] sm:text-xs py-1.5 sm:py-2 px-1 rounded-xl font-bold transition-all shadow-xs flex items-center justify-center gap-1">${isOutOfStock ? 'Stok Habis' : 'Pilih Varian'}</button>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function openDetailModal(productId) {
      const p = products.find(i => i.id === productId);
      if (!p) return;
      currentSelectedProduct = p;
      currentSelectedVariant = p.variants.find(v => Number(v.stock) > 0) || p.variants[0];

      document.getElementById('modal-img').src = p.image;
      document.getElementById('modal-name').innerText = p.name;
      document.getElementById('modal-category').innerText = p.category;
      document.getElementById('modal-sold').innerText = `${p.sold || 0} Terjual`;
      document.getElementById('modal-rating').innerHTML = `<span class="text-yellow-400 text-sm">★</span> ${p.rating || '5.0'}`;
      document.getElementById('modal-warranty').innerText = p.warranty || 'Garansi Toko Resmi';
      document.getElementById('modal-desc').innerText = p.description || 'Tidak ada deskripsi tambahan.';

      renderVariantButtons();
      updateSelectedVariantUI();
      document.getElementById('detail-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function renderVariantButtons() {
      document.getElementById('modal-variants-list').innerHTML = currentSelectedProduct.variants.map((v, idx) => {
        const isSelected = currentSelectedVariant.name === v.name;
        const isOut = Number(v.stock) <= 0;
        return `<button onclick="selectVariant(${idx})" ${isOut ? 'disabled' : ''} class="px-3 py-1.5 rounded-xl text-xs font-semibold transition-all border ${isSelected ? 'bg-blue-50 border-blue-600 text-blue-600 shadow-xs ring-1 ring-blue-600' : isOut ? 'bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed line-through' : 'bg-white border-slate-200 text-slate-700 hover:border-slate-300'}">${v.name}</button>`;
      }).join('');
    }

    function selectVariant(index) { currentSelectedVariant = currentSelectedProduct.variants[index]; renderVariantButtons(); updateSelectedVariantUI(); }

    function updateSelectedVariantUI() {
      const v = currentSelectedVariant;
      document.getElementById('modal-price').innerText = formatIDR(v.price);
      document.getElementById('modal-variant-stock').innerHTML = Number(v.stock) > 0 ? `Stok: <b class="text-slate-800">${v.stock} unit</b>` : `<span class="text-red-500 font-bold">Stok Varian Habis</span>`;
      
      document.getElementById('modal-btn-chat').onclick = () => { window.open(`https://wa.me/6281234567890?text=Halo%20Admin,%20saya%20mau%20tanya%20produk%20*${encodeURIComponent(currentSelectedProduct.name)}*%20varian%20*${encodeURIComponent(v.name)}*%20(${formatIDR(v.price)}).%20Apakah%20stok%20tersedia?`, '_blank'); };
      document.getElementById('modal-btn-cart').onclick = () => { if (Number(v.stock) <= 0) return showToast('Varian ini sedang habis!', 'error'); addToCart(currentSelectedProduct, v); closeDetailModal(); };
      document.getElementById('modal-btn-buy').onclick = () => { if (Number(v.stock) <= 0) return showToast('Varian ini sedang habis!', 'error'); window.open(`https://wa.me/6281234567890?text=${encodeURIComponent(`Halo Admin, saya ingin langsung beli *${currentSelectedProduct.name}* (Paket: ${v.name}) seharga *${formatIDR(v.price)}*. Mohon petunjuk pembayarannya.`)}`, '_blank'); };
    }

    function closeDetailModal() { document.getElementById('detail-modal').classList.add('hidden'); }

    // Keranjang 
    function toggleCart(open) {
      if (open) { document.getElementById('cart-modal').classList.remove('hidden'); setTimeout(() => document.getElementById('cart-drawer').classList.remove('translate-x-full'), 10); } 
      else { document.getElementById('cart-drawer').classList.add('translate-x-full'); setTimeout(() => document.getElementById('cart-modal').classList.add('hidden'), 250); }
    }

    function addToCart(product, variant) {
      const cartItemId = `${product.id}-${variant.name}`;
      const existing = cart.find(c => c.cartId === cartItemId);
      if (existing) {
        if (existing.quantity < variant.stock) { existing.quantity += 1; showToast(`Jumlah pesanan ${product.name} (${variant.name}) ditambah.`); } 
        else { showToast('Batas stok varian tercapai!', 'error'); }
      } else {
        cart.push({ cartId: cartItemId, id: product.id, name: `${product.name} (${variant.name})`, price: variant.price, stock: variant.stock, image: product.image, quantity: 1 });
        showToast(`Berhasil masuk ke keranjang!`);
      }
      renderCart();
    }

    function changeQuantity(cartId, delta) {
      const target = cart.find(c => c.cartId === cartId);
      if (!target) return;
      if (delta > 0 && target.quantity >= target.stock) return showToast('Stok varian tidak mencukupi!', 'error');
      target.quantity += delta;
      if (target.quantity <= 0) cart = cart.filter(c => c.cartId !== cartId);
      renderCart();
    }

    function removeItem(cartId) { cart = cart.filter(c => c.cartId !== cartId); renderCart(); }

    function renderCart() {
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      document.getElementById('cart-title-count').innerText = totalItems;
      if (totalItems > 0) {
        document.getElementById('cart-badge').innerText = totalItems;
        document.getElementById('cart-badge').classList.remove('hidden'); document.getElementById('cart-badge').classList.add('flex');
        document.getElementById('cart-footer').classList.remove('hidden');
      } else {
        document.getElementById('cart-badge').classList.add('hidden'); document.getElementById('cart-badge').classList.remove('flex');
        document.getElementById('cart-footer').classList.add('hidden');
      }
      
      const container = document.getElementById('cart-items');
      if (cart.length === 0) {
        container.innerHTML = `<div class="h-64 flex flex-col items-center justify-center text-slate-400 text-center gap-2"><i data-lucide="shopping-bag" class="w-10 h-10 stroke-1"></i><p class="text-xs">Keranjang Anda masih kosong</p></div>`;
      } else {
        container.innerHTML = cart.map(item => `
          <div class="flex items-center justify-between gap-2.5 p-2.5 bg-slate-50 rounded-2xl border border-slate-100">
            <img src="${item.image}" class="w-10 h-10 rounded-xl object-cover bg-white" />
            <div class="min-w-0 flex-1"><h4 class="text-xs font-semibold text-slate-800 truncate">${item.name}</h4><p class="text-xs text-blue-600 font-bold">${formatIDR(item.price)}</p></div>
            <div class="flex items-center gap-1 bg-white border border-slate-200 rounded-lg p-0.5">
              <button onclick="changeQuantity('${item.cartId}', -1)" class="p-1 hover:text-red-500 text-slate-500"><i data-lucide="minus" class="w-3 h-3"></i></button>
              <span class="text-xs font-bold w-4 text-center">${item.quantity}</span>
              <button onclick="changeQuantity('${item.cartId}', 1)" class="p-1 hover:text-blue-500 text-slate-500"><i data-lucide="plus" class="w-3 h-3"></i></button>
            </div>
            <button onclick="removeItem('${item.cartId}')" class="text-slate-400 hover:text-red-500 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
        `).join('');
      }
      document.getElementById('cart-total-price').innerText = formatIDR(totalPrice);
      lucide.createIcons();
    }

    function processWhatsAppCheckout() {
      if (cart.length === 0) return;
      const totalPrice = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      let message = `*Halo Admin, saya ingin checkout pesanan berikut:*%0A%0A`;
      cart.forEach((item, index) => { message += `${index + 1}. *${item.name}*%0A   Jumlah: ${item.quantity}x%0A   Subtotal: ${formatIDR(item.price * item.quantity)}%0A%0A`; });
      message += `*Total Pembayaran: ${formatIDR(totalPrice)}*%0A%0AMohon instruksi pembayaran & nomor rekening/QRIS. Terima kasih!`;
      window.open(`https://wa.me/6281234567890?text=${message}`, '_blank');
    }

    // Panggil saat aplikasi berjalan
    loadProducts();
    lucide.createIcons();
  </script>
</body>
